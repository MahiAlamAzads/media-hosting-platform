services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: media_platform
      POSTGRES_USER: media
      POSTGRES_PASSWORD: media_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media -d media_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
